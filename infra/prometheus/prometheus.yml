global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: tangerine-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["localhost:3001"]
        labels:
          service: tangerine-api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
