packages:
  - "apps/*"

# Allow these dependencies to run their install/build scripts (pnpm 10+ blocks
# postinstall scripts by default). Needed by Prisma (engine download) and
# esbuild (native binary used by Vite).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  prisma: true
